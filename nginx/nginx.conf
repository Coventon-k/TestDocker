events {
    worker_connections 1024;
}

http {

    # Logs dans stdout/stderr → visibles avec docker compose logs
    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 80;
        server_name localhost;

        # ── API Express ──────────────────────────────────────
        # Toutes les requêtes /api/* sont redirigées vers Express
        location /api/ {
            proxy_pass         http://api:3000/api/;
            # "api" = nom du service dans docker-compose.yml
            # Docker résout ce nom en IP interne automatiquement

            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeout : si Express met plus de 30s, Nginx renvoie 504
            proxy_read_timeout 30s;
        }

        # ── Page d'accueil simple ────────────────────────────
        location / {
            return 200 '{"message":"MyStore Nginx OK","routes":["/api/health","/api/products"]}';
            add_header Content-Type application/json;
        }

        # Taille max body (pour les uploads futurs)
        client_max_body_size 10M;
    }
}
